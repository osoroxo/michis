[package]
name = "michi-rally"
version = "0.1.0"
description = "Michi Rally"
edition = "2021"

[lib]
name = "michi_rally_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
